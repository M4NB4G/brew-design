# Tests on GitHub for every push (docs/items/guard-rails.md, items 1 and 2;
# the browser job is batch F3's): the linter, both suites and the app build run
# in one job, and the browser checks (`npm run e2e`, apps/recipe/test/browser)
# in a second, on every push to any branch and on every pull request, and the
# results show on the pull request. They are checks, not gates: nothing is
# configured to block a merge on either (the owner gates merges). The jobs are
# separate, so the lint and suites result is not held up by the browser.
# Node 24, as Netlify's build (apps/recipe/netlify.toml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
