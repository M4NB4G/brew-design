# Netlify build recipe for the recipe app (Brew Design). The base directory is
# the repository root, so the command runs there: both test suites first, then
# the app build; a failing suite fails the build and nothing deploys.
[build]
  command = "npm test && npm run build"
  publish = "apps/recipe/dist"
  # Cancel the build when a push changes nothing the site is built from
  # (tools/netlify/skip-unchanged.mjs): no deploy, no credits spent.
  ignore = "node tools/netlify/skip-unchanged.mjs"

[build.environment]
  NODE_VERSION = "24"

# Response headers on every path (OWASP HTTP Headers Cheat Sheet): the page may
# load its own files and Google Fonts and nothing else, and may not be put in
# a frame; the browser trusts the type each file is sent as; other sites are
# told this site's name, not the page; and the camera, microphone and location
# (Permissions-Policy calls it geolocation) are refused, which the app never
# uses. The page has no inline script; its styles are set from script, which
# the policy does not block. security-headers.test.js reads this block.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
